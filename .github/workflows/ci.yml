name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default package graph has zero third-party deps. GGUF/Edgerunner is optional
# and must not be required for CI green.

jobs:
  build-test:
    name: "Build & Test (Xcode ${{ matrix.xcode }})"
    runs-on: macos-15
    strategy:
      fail-fast: true
      matrix:
        xcode:
          - "16.2"
          - "16.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_${{ matrix.xcode }}*.app" | head -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "Xcode ${{ matrix.xcode }} not found, using default"
          fi
          xcodebuild -version
          swift --version

      - name: Restore SPM cache
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ matrix.xcode }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ matrix.xcode }}-
            spm-${{ runner.os }}-

      - name: Resolve package (no third-party deps)
        run: |
          set -euo pipefail
          # Ensure optional Edgerunner path is never required for CI.
          export ESPRESSO_DISABLE_GGUF=1
          swift package resolve
          # Fail if a non-empty dependency graph snuck back into the default build.
          DEPS=$(swift package show-dependencies --format json)
          echo "$DEPS"
          echo "$DEPS" | python3 -c 'import json,sys; d=json.load(sys.stdin); deps=d.get("dependencies") or [];
assert not deps, f"default package graph must have zero dependencies, found: {deps}"'

      - name: Build (release)
        run: |
          export ESPRESSO_DISABLE_GGUF=1
          swift build -c release

      - name: Test (unit — no ANE required)
        run: |
          export ESPRESSO_DISABLE_GGUF=1
          swift test \
            --filter "ANETypesTests|MILGeneratorTests|CPUOpsTests|ANEGraphIRTests|ANECodegenTests|ANEPassesTests|ANEBuilderTests|ModelSupportTests|DeltaCompilationTests|LoRAAdapterTests|MigrationParityTests|EspressoGenerateTests|ESPBundleTests|ESPCompilerTests|ESPRuntimeTests|ESPConvertTests|ESPBenchSupportTests|ESPCompilerCLITests|RealModelInferenceTests"

  lint:
    name: Swift Package Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependencies
        run: |
          export ESPRESSO_DISABLE_GGUF=1
          swift package resolve
      - name: Show dependency graph
        run: |
          export ESPRESSO_DISABLE_GGUF=1
          swift package show-dependencies
      - name: Assert macOS platform is 15+
        run: |
          set -euo pipefail
          export ESPRESSO_DISABLE_GGUF=1
          python3 - <<'PY'
          import json, subprocess, sys
          out = subprocess.check_output(["swift", "package", "describe", "--type", "json"], text=True)
          desc = json.loads(out)
          platforms = desc.get("platforms") or []
          macos = next((p for p in platforms if p.get("name") == "macos"), None)
          assert macos is not None, f"missing macOS platform: {platforms}"
          version = macos.get("version", "")
          major = int(str(version).split(".")[0])
          assert major == 15, f"expected macOS 15.x, got {version}"
          print(f"ok: platforms={platforms}")
          PY
